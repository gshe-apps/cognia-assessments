# Checks every screen against the cognia-design plugin. Runs on every push and pull request,
# and before every deploy of main (see deploy-pages.yml), so nothing reaches the prototype link
# without passing.
#
# The checker and rules run from design-system/cognia/, the copy of the plugin committed to this
# repo, so no token is needed. Update that copy with: node scripts/sync-design-system.cjs
name: Cognia design plugin check
on:
  pull_request:
  push:
  workflow_call:
permissions:
  contents: read
jobs:
  design-system:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install headless browser
        run: npm i --no-save playwright && npx playwright install --with-deps chromium

      - name: Screens follow the cognia-design plugin
        run: node design-system/cognia/checks/check-project.cjs

      - name: No visual cascade locks
        run: node scripts/check-design-system.cjs

      - name: Persona flows still work
        run: node verify-homepages.cjs
