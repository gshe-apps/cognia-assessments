/* ============================================================

   ============================================================ */
@layer base {
  * {
    border-color: var(--border);
  }

  body {
    background-color: var(--background);
    color: var(--foreground);
    font-family: var(--font-family), sans-serif;
  }
}

/* ============================================================
   TYPOGRAPHY UTILITIES
   ============================================================ */
@layer utilities {
  .text-title-hero  { font-size: 72px; line-height: 1.1; }

  .text-subheading  { font-size: 20px; line-height: 1.4; }

@media (min-width: 1280px) {

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box;border-color:var(--border)}
html,body{margin:0;height:100%}
body{background:var(--background);color:var(--foreground);font-family:var(--font-family),sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);border:0}
:focus-visible{outline:2px solid var(--primary);outline-offset:2px}
[hidden]{display:none!important}

/* Type scale (typography.md) */
.text-title-page{font-size:48px;line-height:1.2}
.text-heading{font-size:24px;line-height:1.3}
.text-body-base{font-size:16px;line-height:1.5}
.text-body-small{font-size:14px;line-height:1.5}
.font-bold{font-weight:700}.font-semibold{font-weight:600}
.text-muted{color:var(--muted-foreground)}
.big .q-title{font-size:30px}
.big .q-body,.big .opt-label{font-size:20px}

/* Layout helpers (8pt scale) */
.stack{display:flex;flex-direction:column}
.row{display:flex;align-items:center}
.between{justify-content:space-between}
.center{text-align:center;align-items:center}
.grow{flex:1}
.g-1{gap:4px}.g-2{gap:8px}.g-3{gap:12px}.g-4{gap:16px}.g-6{gap:24px}.g-8{gap:32px}
.w-full{width:100%}

/* ---------- 3D stage ---------- */
#scene{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;touch-action:none}
.no-webgl #scene{display:none}
.no-webgl .app{background:linear-gradient(180deg,var(--accent-100),var(--background))}
.veil{position:fixed;inset:0;z-index:1;pointer-events:none;opacity:0;transition:all 200ms;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);background:color-mix(in srgb,var(--background) 45%,transparent)}
.veil.on{opacity:1}
.solid-page .veil{opacity:1;background:var(--background);backdrop-filter:none;-webkit-backdrop-filter:none}

/* App layer */
.app{position:fixed;inset:0;z-index:2;display:flex;justify-content:center}
.screen{position:relative;width:100%;max-width:480px;height:100%;display:flex;flex-direction:column;animation:fade 200ms ease-out both}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes rise{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}

/* ---------- Buttons (lg default, min-w-16, px-4) ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:48px;min-width:64px;padding:0 16px;border-radius:var(--radius);border:1px solid transparent;font-size:16px;font-weight:600;cursor:pointer;transition:all 200ms;text-decoration:none;-webkit-tap-highlight-color:transparent}
.btn svg{width:20px;height:20px}
.btn-solid{background:var(--primary);color:var(--primary-foreground)}
.btn-outline{background:var(--card);color:var(--foreground);border-color:var(--primary)}
.btn-ghost{background:transparent;color:var(--foreground)}
.btn-icon{width:48px;min-width:48px;padding:0}
.btn-icon svg{color:var(--muted-foreground)}
.btn:active{transform:scale(.98)}

/* Glass surfaces sit over the 3D room. Colours are derived from tokens. */
.glass{background:color-mix(in srgb,var(--card) 72%,transparent);backdrop-filter:blur(16px) saturate(1.2);-webkit-backdrop-filter:blur(16px) saturate(1.2);box-shadow:var(--shadow-lg);border:1px solid color-mix(in srgb,var(--card) 60%,transparent)}
.pill{display:inline-flex;align-items:center;gap:4px;height:40px;padding:0 12px;border-radius:var(--rounded-full)}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:4px;height:24px;padding:0 8px;border-radius:var(--rounded-full);font-size:14px;font-weight:600;white-space:nowrap}
.badge svg{width:14px;height:14px}
.badge-success{background:var(--success-light);color:var(--success)}
.badge-warning{background:var(--warning-light);color:var(--warning)}
.badge-info{background:var(--info-light);color:var(--info)}
.badge-secondary{background:var(--secondary);color:var(--secondary-foreground)}
.badge-theme-light{background:var(--accent-100);color:var(--secondary-foreground)}
.badge-theme-solid{background:var(--accent-300);color:var(--primary-foreground)}
.stars svg{width:16px;height:16px;color:var(--accent-300)}
.stars{font-size:14px;font-weight:600}
.pop{animation:pop 200ms ease-out}
@keyframes pop{from{transform:scale(1.25)}to{transform:scale(1)}}
.icon-tile{display:inline-flex;align-items:center;justify-content:center;width:40px;height:40px;border-radius:var(--radius);background:var(--card);flex:none}
.icon-tile svg{width:20px;height:20px;color:var(--accent-300)}
.icon-plain svg{width:20px;height:20px;color:var(--muted-foreground)}
.meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted-foreground);font-size:14px}
.meta span{display:inline-flex;align-items:center;gap:4px}
.meta svg{width:16px;height:16px}

/* ---------- Header ---------- */
.hud{display:flex;align-items:center;gap:8px;padding:12px var(--horizontal-padding);padding-top:calc(12px + env(safe-area-inset-top))}
.hud .logo{width:40px;height:40px;border-radius:var(--rounded-full);display:inline-flex;align-items:center;justify-content:center}
.hud .logo svg{width:24px;height:24px;display:block}
.avatar{width:40px;height:40px;border-radius:var(--rounded-full);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:400;cursor:pointer;border:0}

/* ---------- Sign in ---------- */
.signin{margin:auto var(--horizontal-padding);padding:24px;border-radius:var(--radius);animation:rise 200ms ease-out both}
.signin .mark{width:56px;height:56px}
.signin .mark svg{width:100%;height:100%;display:block}
.field{display:flex;flex-direction:column;gap:8px;text-align:left}
.field label{font-size:14px;font-weight:600}
.input-wrap{position:relative}
.input{width:100%;height:48px;border-radius:var(--radius);border:1px solid var(--muted-foreground);background:var(--primary-foreground);color:var(--foreground);padding:0 16px;font:inherit;font-size:16px}
.input-wrap .input{padding-right:56px}
.input-wrap .btn-icon{position:absolute;right:0;top:0}
.input[aria-invalid="true"]{border-color:var(--destructive)}
.err{display:flex;align-items:center;gap:4px;color:var(--destructive);font-size:14px}
.err svg{width:16px;height:16px;flex:none}

/* ---------- Landing ---------- */
.landing-body{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 var(--horizontal-padding) calc(16px + env(safe-area-inset-bottom));gap:12px;position:relative}
.tcard{display:flex;flex-direction:column;gap:16px;padding:24px;border-radius:var(--radius);text-align:left;width:100%;touch-action:none;user-select:none;-webkit-user-select:none;transition:transform 200ms ease-out,opacity 200ms ease-out}
button.tcard{cursor:pointer}
.tcard.dragging{transition:none}
.tcard.enter{animation:rise 200ms ease-out both}
.tcard.leave-up{transform:translateY(-140%) scale(.9);opacity:0}
.tcard.leave-down{transform:translateY(60%) scale(.95);opacity:0}
.tcard .cta{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;border-radius:var(--radius);background:var(--primary);color:var(--primary-foreground);font-weight:600;font-size:16px}
.tcard .cta svg{width:20px;height:20px}
.note{border-left:4px solid var(--accent-300);padding:8px 12px;background:color-mix(in srgb,var(--accent-100) 70%,transparent);border-radius:0 var(--radius) var(--radius) 0}
.result-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.result-row div{display:flex;flex-direction:column;align-items:center;padding:8px;border-radius:var(--radius);background:color-mix(in srgb,var(--card) 80%,transparent)}
.dots{position:absolute;right:8px;top:50%;transform:translateY(-50%);display:flex;flex-direction:column;gap:8px}
.dot{width:8px;height:8px;border-radius:var(--rounded-full);background:color-mix(in srgb,var(--card) 70%,transparent);box-shadow:var(--shadow-sm);transition:all 200ms}
.dot.on{height:24px;background:var(--primary)}
.swipe-hint{display:flex;justify-content:center;gap:8px}
.swipe-hint .btn{height:40px;border-radius:var(--rounded-full);font-size:14px}
.chev{animation:nudge 1600ms ease-in-out infinite}
@keyframes nudge{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}

/* ---------- Test deck ---------- */
.deck-wrap{flex:1;position:relative;margin:0 var(--horizontal-padding);min-height:0}
.qcard{position:absolute;inset:0 0 32px 0;display:flex;flex-direction:column;background:var(--card);color:var(--card-foreground);border-radius:var(--radius);box-shadow:var(--shadow-lg);transition:transform 200ms ease-out,opacity 200ms ease-out;transform-origin:50% 100%;will-change:transform;touch-action:pan-y;overflow:hidden}
.qcard.dragging{transition:none}
.qcard .qbody{flex:1;overflow:auto;padding:24px 16px;display:flex;flex-direction:column;gap:16px;-webkit-overflow-scrolling:touch}
.qcard .qfoot{padding:12px 16px 16px;border-top:1px solid var(--border)}
.qcard[aria-hidden="true"] *{pointer-events:none}
.side{flex:none;width:48px;height:48px;border-radius:var(--rounded-full);display:inline-flex;align-items:center;justify-content:center;border:0;cursor:pointer;opacity:.85;transition:all 200ms}
.side[hidden]{display:inline-flex!important;visibility:hidden}
.side svg{width:20px;height:20px;color:var(--muted-foreground)}
.deck-meta{display:flex;align-items:center;gap:8px;padding:4px var(--horizontal-padding) calc(12px + env(safe-area-inset-bottom));min-height:64px}
#deck-msg{flex:1;text-align:center}
.segs{display:flex;gap:4px;flex:1}
.seg{flex:1;height:8px;border-radius:var(--rounded-full);background:color-mix(in srgb,var(--card) 70%,var(--secondary));transition:all 200ms}
.seg.done{background:var(--accent-300)}
.seg.now{background:var(--accent-200)}

.story{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:var(--radius);background:var(--accent-100)}
.panel{display:flex;flex-direction:column;gap:16px;padding:16px;border-radius:var(--radius);background:var(--background)}
.frac{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;gap:4px;font-size:24px;font-weight:600;line-height:1}
.frac .bar{align-self:stretch;height:2px;background:var(--foreground);border-radius:var(--rounded-full)}
.eq{display:flex;align-items:center;flex-wrap:wrap;gap:12px;font-size:24px;font-weight:600}
.step-label{font-size:14px;font-weight:600;color:var(--muted-foreground)}
.blank{height:48px;min-width:64px;padding:0 8px;border-radius:var(--radius);border:2px dashed var(--muted-foreground);background:var(--card);font:inherit;font-size:24px;font-weight:600;cursor:pointer;transition:all 200ms}
.blank.active{border:2px solid var(--primary);background:var(--accent-100)}
.blank.filled{border-style:solid;border-color:var(--primary)}
.tray{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chip{height:48px;min-width:64px;border-radius:var(--radius);border:1px solid var(--primary);background:var(--card);font-size:24px;font-weight:600;cursor:pointer;transition:all 200ms}
.chip[aria-pressed="true"]{background:var(--primary);color:var(--primary-foreground)}
.opts{display:flex;flex-direction:column;gap:12px}
.opt{display:flex;align-items:center;gap:12px;min-height:56px;padding:12px 16px;border-radius:var(--radius);background:var(--card);border:1px solid var(--muted-foreground);cursor:pointer;text-align:left;width:100%;font:inherit;transition:all 200ms}
.opt .letter{flex:none;width:32px;height:32px;border-radius:var(--rounded-full);background:var(--secondary);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:600}
.opt .tick{margin-left:auto;flex:none;width:24px;height:24px;border-radius:var(--rounded-full);border:2px solid var(--muted-foreground);display:inline-flex;align-items:center;justify-content:center}
.opt .tick svg{width:16px;height:16px;opacity:0;color:var(--primary-foreground)}
.opt[aria-checked="true"]{border:2px solid var(--primary);background:var(--accent-100);padding:11px 15px}
.opt[aria-checked="true"] .letter{background:var(--primary);color:var(--primary-foreground)}
.opt[aria-checked="true"] .tick{background:var(--primary);border-color:var(--primary)}
.opt[aria-checked="true"] .tick svg{opacity:1}
.opt-label{font-size:16px}
.match-row{display:flex;flex-direction:column;gap:12px;border-radius:var(--radius);background:var(--card);padding:12px 16px;border:1px solid var(--muted-foreground)}
.match-row.open{border:2px solid var(--primary);padding:11px 15px}
.match-head{display:flex;align-items:center;gap:12px;width:100%;background:none;border:0;padding:0;cursor:pointer;text-align:left;min-height:48px}
.match-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.match-grid .chip{font-size:16px}
.cheer{font-size:14px;font-weight:600;color:var(--foreground)}
.cheer-pill{display:inline-flex;align-items:center;gap:4px;height:32px;padding:0 12px;border-radius:var(--rounded-full)}
.cheer-pill svg{width:16px;height:16px;color:var(--accent-300)}
.finish-icon{width:80px;height:80px;border-radius:var(--rounded-full);background:var(--accent-100);display:inline-flex;align-items:center;justify-content:center}
.finish-icon svg{width:40px;height:40px;color:var(--accent-400)}

/* ---------- Review (clean page) ---------- */
.review-head{display:flex;align-items:center;gap:8px;padding:8px 8px 8px 8px;padding-top:calc(8px + env(safe-area-inset-top));background:var(--card);border-bottom:1px solid var(--border);min-height:64px}
.review-body{flex:1;overflow:auto;padding:24px var(--horizontal-padding) 24px;display:flex;flex-direction:column;gap:16px}
.ritem{display:flex;flex-direction:column;gap:8px;padding:16px;border-radius:var(--radius);background:var(--card)}
.ritem .num{width:32px;height:32px;border-radius:var(--rounded-full);background:var(--secondary);display:inline-flex;align-items:center;justify-content:center;font-weight:600;font-size:14px;flex:none}
.answer{padding:8px 12px;border-radius:var(--radius);background:var(--background)}
.review-foot{padding:12px var(--horizontal-padding) calc(12px + env(safe-area-inset-bottom));background:var(--card);border-top:1px solid var(--border)}

/* ---------- Overlays ---------- */
.scrim{position:fixed;inset:0;z-index:40;background:var(--backdrop-overlay);display:flex;align-items:flex-end;justify-content:center;animation:fade 200ms ease-out both}
.scrim.mid{align-items:center;padding:16px;z-index:50}
.sheet{width:100%;max-width:480px;background:var(--popover);color:var(--popover-foreground);border-radius:var(--radius) var(--radius) 0 0;box-shadow:var(--shadow-lg);padding:24px var(--horizontal-padding) calc(16px + env(safe-area-inset-bottom));animation:rise 200ms ease-out both}
.dialog{width:100%;max-width:400px;background:var(--popover);color:var(--popover-foreground);border-radius:var(--radius);box-shadow:var(--shadow-lg);padding:24px;animation:rise 200ms ease-out both}
.switch-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:48px}
.switch{position:relative;width:44px;height:24px;border-radius:var(--rounded-full);background:var(--muted-foreground);border:0;cursor:pointer;flex:none;transition:all 200ms;padding:0}
.switch::after{content:"";position:absolute;top:2px;left:2px;width:20px;height:20px;border-radius:var(--rounded-full);background:var(--primary-foreground);transition:all 200ms}
.switch[aria-checked="true"]{background:var(--primary)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.trophy-layer{position:fixed;inset:0;z-index:50;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:color-mix(in srgb,var(--background) 88%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:fade 200ms ease-out both;cursor:pointer;padding:24px}
.trophy-layer canvas{width:min(320px,80vw);height:min(320px,80vw);display:block}
.trophy-layer .copy{animation:rise 200ms ease-out 400ms both;text-align:center}

@media (hover:hover){
  .btn-solid:hover{box-shadow:inset 0 0 0 999px var(--opacity-secondary-20)}
  .btn-outline:hover{background:var(--accent)}
  .btn-ghost:hover{background:var(--secondary)}
  button.tcard:hover{box-shadow:var(--shadow-xl)}
  .chip:hover{background:var(--accent)}
  .opt:hover{box-shadow:var(--shadow-md)}
  .side:hover{opacity:1}
}
@media (prefers-reduced-motion:reduce){
  .chev{animation:none}
}

/* ---- Landing: one glass card in front of the classroom ---- */
const deckCards = () => {
  const cur = S.status === 'done'
    ? { kind:'done', title:TEST.title, subject:TEST.subject }
    : { kind:'todo', title:TEST.title, subject:TEST.subject };
  return [cur, ...PAST.map(p => Object.assign({ kind:'past' }, p))];
};
function cardHTML(c, idx, total) {
  if (c.kind === 'todo') {
    const inProg = S.status === 'progress', n = answered();
    return `<button class="tcard glass" data-card="open" aria-label="${inProg ? 'Continue' : 'Start'} ${c.title}, card ${idx + 1} of ${total}">
      <span class="row between"><span class="badge badge-theme-light">${c.subject}</span>${inProg ? `<span class="badge badge-info">${n} of ${Q.length} done</span>` : `<span class="badge badge-secondary">New</span>`}</span>
      <span class="stack g-2"><span class="text-heading font-semibold">${c.title}</span>
        <span class="meta"><span>${ic('list')}${Q.length} questions</span><span>${ic('clock')}About ${TEST.minutes} min</span><span>${ic('calendar')}${TEST.due}</span></span></span>
      <span class="note stack"><span class="text-body-small font-semibold">${TEST.teacher}</span><span class="text-body-small">${TEST.note}</span></span>
      <span class="cta">${inProg ? 'Keep going' : 'Start test'}${ic('right')}</span>
    </button>`;
  }
  const done = c.kind === 'done';
  const stats = done ? [[`${answered()}/${Q.length}`, 'Answered'], [`+${starsEarned()}`, 'Stars'], [`${minsTaken()} min`, 'Time']] : [[`${c.questions}/${c.questions}`, 'Answered'], [`+${c.stars}`, 'Stars'], [`${c.minutes} min`, 'Time']];

function blank(idx, val) {
  const a = S.activeBlank === idx;
  return `<button class="blank ${val !== null ? 'filled' : ''} ${a ? 'active' : ''}" data-blank="${idx}" aria-label="Box ${idx + 1}${val !== null ? ', ' + val : ', empty'}${a ? ', selected' : ''}">${val !== null ? val : ''}</button>`;
}
function body(k) {
  const q = Q[k];
  if (q.type === 'fill') {

    return { body:`${qLabel(k)}${storyHTML(q)}${title(q, k)}
      <div class="panel">
        <div class="stack g-2"><span class="step-label">Step 1 · Turn tenths into hundredths</span><div class="eq">${frac(3, 10)}<span>=</span>${bf(blank(0, v[0]), blank(1, v[1]))}</div></div>
        <div class="stack g-2"><span class="step-label">Step 2 · Add the two fractions</span><div class="eq">${frac(30, 100)}<span>+</span>${frac(25, 100)}<span>=</span>${bf(blank(2, v[2]), '100')}</div></div>
        <div class="stack g-2"><span class="step-label">Answer</span><div class="eq"><span class="q-body">So</span>${bf(blank(3, v[3]), '100')}<span class="text-body-base q-body" style="font-weight:400">of the dogs</span></div></div>
      </div>`,
      foot:`<div class="stack g-2"><p class="text-body-small text-muted center" style="text-align:center">Tap a number to fill the highlighted box</p>
        <div class="row g-2"><div class="tray grow">${q.bank.map(n => `<button class="chip" data-chip="${n}">${n}</button>`).join('')}</div></div>
        <button class="btn btn-ghost w-full" data-go="clear">${ic('undo')}Clear box</button></div>` };
  }
  if (q.type === 'match') {
    const v = S.answers[1];
    return { body:`${qLabel(k)}${storyHTML(q)}${title(q, k)}<div class="stack g-3">${q.rows.map((r, j) => { const open = S.openRow === j;
      return `<div class="match-row ${open ? 'open' : ''}"><button class="match-head" data-row="${j}" aria-expanded="${open}">

const starsEarned = () => answered() + 2;

/* Landing card: swipe up for older, swipe down for newer, tap to open */
function bindCard() {
  const el = document.querySelector('.tcard'); if (!el) return;
  let sy = 0, sx = 0, dy = 0, drag = false, id = null;
  el.addEventListener('pointerdown', e => { sy = e.clientY; sx = e.clientX; dy = 0; drag = false; id = e.pointerId; });
  el.addEventListener('pointermove', e => {
    if (e.pointerId !== id) return;
    const ny = e.clientY - sy, nx = e.clientX - sx;
    if (!drag && Math.abs(ny) > 10 && Math.abs(ny) > Math.abs(nx)) { drag = true; el.setPointerCapture(id); el.classList.add('dragging'); }
    if (drag) { dy = ny; el.style.transform = `translateY(${dy}px) scale(${1 - Math.min(Math.abs(dy), 300) / 3000})`; el.style.opacity = String(1 - Math.min(Math.abs(dy), 300) / 600); }
  });

    if (e.pointerId !== id) return; id = null;

    const total = deckCards().length;

}

/* Question deck: swipe left for next, right for back */
function bindDeck() {
  const deck = document.getElementById('deck');
  let sx = 0, sy = 0, dx = 0, drag = false, id = null, el = null, decided = false;
  deck.addEventListener('pointerdown', e => {
    el = e.target.closest('.qcard'); if (!el || +el.dataset.k !== S.i) { el = null; return; }
    sx = e.clientX; sy = e.clientY; dx = 0; drag = false; decided = false; id = e.pointerId;
  });
  deck.addEventListener('pointermove', e => {
    if (!el || e.pointerId !== id) return;
    const nx = e.clientX - sx, ny = e.clientY - sy;
    if (!decided && (Math.abs(nx) > 10 || Math.abs(ny) > 10)) { decided = true; drag = Math.abs(nx) > Math.abs(ny) * 1.2; if (drag) { el.setPointerCapture(id); el.classList.add('dragging'); } }
    if (!drag) return;
    dx = nx; const edge = (dx > 0 && S.i === 0) || (dx < 0 && S.i === cardCount() - 1);
    const eff = edge ? dx * 0.25 : dx;
    el.style.transform = `translateX(${eff}px) rotate(${eff / 22}deg)`;
    const nxt = document.querySelector(`.qcard[data-k="${S.i + 1}"]`);
    if (nxt && dx < 0) nxt.style.transform = `translateY(${12 - Math.min(-dx, 160) / 160 * 12}px) scale(${0.95 + Math.min(-dx, 160) / 160 * 0.05})`;
  });
  const end = e => {
    if (!el || e.pointerId !== id) return;
    const was = drag; id = null; el.classList.remove('dragging');
    if (was) { swallowClick = true; setTimeout(() => swallowClick = false, 60);
      if (dx < -80) moveDeck(1); else if (dx > 80) moveDeck(-1); else layoutDeck(); }
    el = null; drag = false;
  };
  deck.addEventListener('pointerup', end); deck.addEventListener('pointercancel', end);
}
let swallowClick = false;
document.addEventListener('click', e => { if (swallowClick) { e.stopPropagation(); e.preventDefault(); swallowClick = false; } }, true);

    const s = reduceMotion ? 1 : elastic(Math.min(1, t / 0.8)); tg.scale.setScalar(Math.max(0.001, s));
    tg.rotation.y = reduceMotion ? 0.3 : Math.sin(t * 1.3) * 0.7; tg.position.y = -0.2 + Math.sin(t * 2) * 0.05;
    if (!reduceMotion) conf.forEach(m => { m.userData.v.y -= 6 * dt; m.position.addScaledVector(m.userData.v, dt); m.rotation.x += m.userData.r.x * dt; m.rotation.y += m.userData.r.y * dt; });
    else conf.forEach(m => m.visible = false);
    r.render(sc, cam);
    if (now - t0 > dur) finish();
  };
  raf = requestAnimationFrame(loop);
}

/* ======================================================================
   Events
   ====================================================================== */
app.addEventListener('submit', e => {
  e.preventDefault();
  const id = app.querySelector('#sid').value.trim(), pw = app.querySelector('#pw').value;
  signinErr = { id:!id, pw:!pw };
  if (!id || !pw) { render(!id ? '#sid' : '#pw'); if (id) app.querySelector('#sid').value = id; return; }
  signinErr = { id:false, pw:false };
  toLanding(0);
});
app.addEventListener('click', e => {
  const t = e.target.closest('button, [data-scrim], .tcard');
  if (!t) return;
  if (t.hasAttribute('data-scrim') && e.target === t) { overlay = null; render(); return; }
  if (t.classList.contains('tcard')) { if (t.dataset.dragged) return; if (t.dataset.card === 'open') startTest(); return; }
  const g = t.dataset.go;
  if (g === 'togglepw') { const v = app.querySelector('#sid')?.value || '', p = app.querySelector('#pw')?.value || ''; showPw = !showPw; render('[data-go="togglepw"]'); app.querySelector('#sid').value = v; app.querySelector('#pw').value = p; return; }
  if (g === 'signout') { S = fresh(); justSubmitted = false; render(); World.go('signin', 1200); return; }
  if (g === 'cardnext') return changeCard(1);
  if (g === 'cardprev') return changeCard(-1);
  if (g === 'exit') { overlay = 'exit'; return render(); }
  if (g === 'tools') { overlay = 'tools'; return render(); }
  if (g === 'close') { overlay = null; return render(); }
  if (g === 'leave') return toLanding(0);
  if (g === 'next') return moveDeck(1);
  if (g === 'prev') return moveDeck(-1);
  if (g === 'speak') { const q = Q[S.i]; speak([q.story || q.passage, q.title].join('. ')); return; }
  if (g === 'review') { S.screen = 'review'; overlay = null; render(); window.scrollTo(0, 0); return; }
  if (g === 'backdeck') { S.i = Q.length; S.screen = 'test'; World.go('test', 0); render(); return; }
  if (g === 'handin') { if (left()) { overlay = 'handin'; return render(); } return handIn(); }
  if (g === 'finishfirst') { S.i = Q.findIndex((_, k) => !isAnswered(k)); S.screen = 'test'; overlay = null; World.go('test', 0); render(); return; }
  if (g === 'confirmhandin') return handIn();
  if (g === 'clear') { S.answers[0][S.activeBlank] = null; cheer = ''; refreshCard(0, `[data-blank="${S.activeBlank}"]`); return; }
  if (t.dataset.switch) { const k = t.dataset.switch; S[k] = !S[k]; if (S.screen === 'test') { overlay = 'tools'; render('#' + t.id); } else render('#' + t.id); return; }
  if (t.dataset.jump !== undefined) { S.i = +t.dataset.jump; S.screen = 'test'; World.go('test', 0); render(); return; }

  if (t.dataset.blank !== undefined) { S.activeBlank = +t.dataset.blank; refreshCard(0, `[data-blank="${S.activeBlank}"]`); return; }
  if (t.dataset.chip !== undefined) {
    const a = S.answers[0]; a[S.activeBlank] = +t.dataset.chip;
    const ne = a.findIndex(v => v === null); if (ne >= 0) S.activeBlank = ne;
    const got = isAnswered(0) && earn(0); refreshCard(0, `[data-chip="${t.dataset.chip}"]`); if (got) popStars(); return;
  }
  if (t.dataset.row !== undefined) { S.openRow = S.openRow === +t.dataset.row ? -1 : +t.dataset.row; refreshCard(1, `[data-row="${t.dataset.row}"]`); return; }
  if (t.dataset.match !== undefined) {
    const a = S.answers[1]; a[+t.dataset.match] = t.dataset.val;
    const no = a.findIndex(v => v === null); S.openRow = no;
    const got = isAnswered(1) && earn(1); refreshCard(1, no >= 0 ? `[data-row="${no}"]` : null); if (got) popStars(); return;
  }
  if (t.dataset.opt !== undefined) { const k = +t.dataset.q; S.answers[k] = +t.dataset.opt; const got = earn(k); refreshCard(k, `[data-opt="${t.dataset.opt}"]`); if (got) popStars(); return; }
});
function handIn() { S.status = 'done'; S.finishedAt = Date.now(); S.stars += 2; S.streak += 1; S.screen = 'landing'; S.card = 0; save(); World.go('land0', 0); trophy(); }
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && overlay) { overlay = null; render(); return; }
  if (overlay || /INPUT|TEXTAREA/.test(document.activeElement?.tagName || '')) return;
  if (S.screen === 'test' && e.key === 'ArrowRight') moveDeck(1);
  if (S.screen === 'test' && e.key === 'ArrowLeft') moveDeck(-1);
  if (S.screen === 'landing' && e.key === 'ArrowDown' && S.card < deckCards().length - 1) changeCard(1);
  if (S.screen === 'landing' && e.key === 'ArrowUp' && S.card > 0) changeCard(-1);
});

/* Boot */
if (S.screen === 'test' && S.status !== 'progress') S.screen = 'landing';
const startStation = { signin:'signin', landing:landStation(S.card), test:'test', review:'review' }[S.screen] || 'signin';
World.go(startStation, 0);
render();
</script>
