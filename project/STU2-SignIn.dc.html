<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Student option 2 · Sign in</title>
<script src="./support.js"></script>
<script src="./live-session.js"></script>
<link rel="stylesheet" href="ds/cognia/tokens.css"><link rel="stylesheet" href="ds/cognia/cognia-components.css"><script src="ds/cognia/cognia-components.js"></script><link rel="stylesheet" href="stu2.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div class="stu2 theme-assessments" style="position: fixed; inset: 0">

<div class="stu2-layer" style="padding: 32px 16px 24px; gap: 32px">
<div class="signin-col" style="flex: 1; display: flex; flex-direction: column; justify-content: center; gap: 32px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 12px; text-align: center">
<img src="assets/stu2/cognia-c.svg" alt="Cognia" style="width: 56px; height: 56px">
<h1 class="text-heading" id="si-t">Hi there!</h1>
<p class="text-body-base text-muted-foreground">Sign in with the details from your teacher.</p>
</div>
<form style="display: flex; flex-direction: column; gap: 24px" aria-labelledby="si-t" novalidate onSubmit="{{submit}}">
<div class="field"><label class="label" for="pw">Student passcode *</label>
<div style="position: relative"><input class="input" id="pw" type="{{pwType}}" inputmode="numeric" autocomplete="off" placeholder="e.g. 4821" style="padding-right: 56px" value="{{pwVal}}" onInput="{{setPw}}" aria-invalid="{{pwInvalid}}" aria-describedby="pw-err">
<button type="button" class="btn btn-ghost btn-icon btn-lg" style="position: absolute; right: 0; top: 0" aria-label="{{pwLabel}}" onClick="{{togglePw}}">
<sc-if value="{{showPw}}" hint-placeholder-val="{{ false }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"></path><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"></path><path d="M6.61 6.61A13.53 13.53 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"></path><path d="m2 2 20 20"></path></svg></sc-if>
<sc-if value="{{hidePw}}" hint-placeholder-val="{{ true }}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7S2 12 2 12Z"></path><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6"></path></svg></sc-if>
</button></div>
<sc-if value="{{pwErr}}" hint-placeholder-val="{{ false }}"><p class="text-body-small field-error" id="pw-err">{{pwErr}}</p></sc-if></div>
<div class="field"><label class="label" for="sc">Session code *</label><input class="input" id="sc" autocomplete="off" autocapitalize="characters" spellcheck="false" placeholder="e.g. MATH-27" value="{{scVal}}" onInput="{{setSc}}" aria-invalid="{{scInvalid}}" aria-describedby="sc-err">
<sc-if value="{{scErr}}" hint-placeholder-val="{{ false }}"><p class="text-body-small field-error" id="sc-err">{{scErr}}</p></sc-if></div>
<button type="submit" class="btn btn-lg" style="width: 100%">{{signLabel}}<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="m12 5 7 7-7 7"></path></svg></button>
<p class="text-body-small text-muted-foreground" style="text-align: center">Your student passcode is from your teacher and the session code is on the board.</p>
</form>
</div>
<p class="text-body-small text-muted-foreground" style="text-align: center">Use student passcodes: 1104, 2267, 3391, 4458, 5532, 6619. Use MATH-27 as the session code.</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const st = this.state || {};
    const show = !!st.showPw;
    const live = window.CogniaLive;
    const submit = (e) => {
      if (e) e.preventDefault();
      if (st.busy) return;
      const pw = (st.pw || '').trim(), sc = (st.sc || '').trim();
      const student = live && live.findStudent(pw);
      const pwErr = !pw ? 'Enter your student passcode.' : !student ? 'We don’t recognise that passcode. Check it with your teacher.' : '';
      const scErr = !sc ? 'Enter the session code.' : !(live && live.sessionMatches(sc)) ? 'That session code doesn’t match. Check the board.' : '';
      if (pwErr || scErr) { this.setState({ pwErr, scErr }); return; }
      this.setState({ busy: true, pwErr: '', scErr: '' });
      live.signIn(student).finally(() => { location.href = 'STU2-Classroom.dc.html'; });
    };
    return {
      showPw: show, hidePw: !show,
      pwType: show ? 'text' : 'password',
      pwLabel: show ? 'Hide passcode' : 'Show passcode',
      togglePw: () => this.setState({ showPw: !show }),
      pwVal: st.pw || '', scVal: st.sc || '',
      setPw: (e) => { this.state.pw = e.target.value; if (st.pwErr) this.setState({ pwErr: '' }); },
      setSc: (e) => { this.state.sc = e.target.value; if (st.scErr) this.setState({ scErr: '' }); },
      pwErr: st.pwErr || '', scErr: st.scErr || '',
      pwInvalid: st.pwErr ? 'true' : 'false', scInvalid: st.scErr ? 'true' : 'false',
      signLabel: st.busy ? 'Signing in' : 'Sign in',
      submit
    };
  }
}
</script>
</body>
</html>
